name: Validate changes

on:
  pull_request:
  push:
    branches:
      - main

# A newer push to the same PR makes the older run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Validate Rust workspace
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt,rust-src

      # Keyed on the toolchain and Cargo.lock only, with prefix fallback, so a
      # workflow edit or a dependency bump reuses the previous build instead of
      # starting cold.
      - name: Cache cargo crates and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: validate
          cache-on-failure: true

      - name: Cache pinned Rust tools
        uses: actions/cache@v4
        with:
          path: tmp/rust-tools
          key: ${{ runner.os }}-${{ runner.arch }}-rust-tools-${{ hashFiles('scripts/tooling/tool-versions.tsv', 'scripts/tooling/bootstrap-tools.sh', 'rust-toolchain.toml') }}

      - name: Verify and install pinned Rust tools
        run: |
          scripts/tooling/bootstrap-tools.sh ci
          echo "$GITHUB_WORKSPACE/tmp/rust-tools/bin" >> "$GITHUB_PATH"

      - name: Test tool bootstrap
        run: python3 -m unittest scripts.tests.test_bootstrap_tools -v

      - name: Check SQLx query metadata against native migrations
        id: sqlx_metadata
        background: true
        run: |
          scripts/tooling/bootstrap-tools.sh sqlx
          python3 scripts/tooling/prepare-sqlx.py --check

      - name: Build codex-router variants and quota-reset harness
        id: build
        background: true
        run: |
          cargo build -p codex-router-cli --bin codex-router
          cargo build -p codex-router-cli --all-features --bin codex-router
          install_root="${RUNNER_TEMP}/codex-router-cli-all-features-install"
          cargo install --path crates/codex-router-cli --all-features --root "${install_root}"
          test -x "${install_root}/bin/codex-router"
          test "$(find "${install_root}/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          cargo build -p codex-router-quota-reset-test-harness --bin codex-router-quota-reset-test-harness

      - name: Check Rust formatting
        id: format
        background: true
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        id: lint
        background: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Homebrew release automation
        id: homebrew_release_automation
        background: true
        run: python3 -m unittest scripts.tests.test_update_homebrew_formula -v

      - name: Enforce dependency policy
        id: dependency_policy
        background: true
        run: cargo deny check

      - name: Audit dependency vulnerabilities
        id: dependency_audit
        background: true
        run: cargo audit

      - name: Wait for build
        wait: build

      - name: Test quota-reset terminal integration
        id: quota_reset_terminal_integration
        background: true
        run: cargo nextest run --profile ci -p codex-router-quota-reset-test-harness

      - name: Test Rust workspace
        id: workspace_tests
        background: true
        run: cargo nextest run --profile ci --workspace

      - name: Wait for validation
        wait-all:

  # Production runs on macOS, and the FuturesUnordered waker bug only
  # reproduced with optimized code on the kqueue reactor.
  macos:
    name: Validate macOS-specific behaviour
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - name: Cache cargo crates and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
          cache-on-failure: true

      - name: Test optimized idle provider transport
        run: cargo test --locked --release -p codex-router-host --test provider_transport_idle
