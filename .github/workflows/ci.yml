name: Validate changes

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Validate Rust workspace
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,rust-src

      - name: Cache cargo crates, tools, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            target
          key: ${{ runner.os }}-cargo-1.95.0-${{ hashFiles('Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95.0-
            ${{ runner.os }}-cargo-

      - name: Install cargo tools
        run: |
          command -v cargo-nextest >/dev/null || cargo install cargo-nextest --locked
          command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Build codex-router variants and quota-reset harness
        id: build
        background: true
        run: |
          cargo build -p codex-router-cli --bin codex-router
          cargo build -p codex-router-cli --all-features --bin codex-router
          install_root="${RUNNER_TEMP}/codex-router-cli-all-features-install"
          cargo install --path crates/codex-router-cli --all-features --root "${install_root}"
          test -x "${install_root}/bin/codex-router"
          test "$(find "${install_root}/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          cargo build -p codex-router-quota-reset-test-harness --bin codex-router-quota-reset-test-harness

      - name: Check Rust formatting
        id: format
        background: true
        run: cargo fmt --all -- --check

      - name: Lint Rust workspace
        id: lint
        background: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test Homebrew release automation
        id: homebrew_release_automation
        background: true
        run: python3 -m unittest scripts.tests.test_update_homebrew_formula -v

      - name: Enforce dependency policy
        id: dependency_policy
        background: true
        run: cargo deny check

      - name: Audit dependency vulnerabilities
        id: dependency_audit
        background: true
        run: cargo audit

      - name: Wait for build
        wait: build

      - name: Test quota-reset terminal integration
        id: quota_reset_terminal_integration
        background: true
        run: cargo nextest run -p codex-router-quota-reset-test-harness

      - name: Test Rust workspace
        id: workspace_tests
        background: true
        run: cargo nextest run --workspace

      - name: Wait for validation
        wait-all:
