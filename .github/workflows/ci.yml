name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    name: Rust
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy,rustfmt,rust-src

      - name: Cache cargo crates, tools, and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
            ~/.cargo/bin/cargo-nextest
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-audit
            target
          key: ${{ runner.os }}-cargo-1.95.0-${{ hashFiles('Cargo.lock', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.95.0-
            ${{ runner.os }}-cargo-

      - name: Install cargo tools
        run: |
          command -v cargo-nextest >/dev/null || cargo install cargo-nextest --locked
          command -v cargo-deny >/dev/null || cargo install cargo-deny --locked
          command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Homebrew formula updater tests
        run: python3 -m unittest scripts.tests.test_update_homebrew_formula -v

      - name: Integrated quota reset PTY harness
        run: |
          cargo build -p codex-router-cli --bin codex-router
          cargo build -p codex-router-cli --all-features --bin codex-router
          install_root="${RUNNER_TEMP}/codex-router-cli-all-features-install"
          cargo install --path crates/codex-router-cli --all-features --root "${install_root}"
          test -x "${install_root}/bin/codex-router"
          test "$(find "${install_root}/bin" -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          cargo build -p codex-router-quota-reset-test-harness --bin codex-router-quota-reset-test-harness
          cargo clippy -p codex-router-quota-reset-test-harness --all-targets -- -D warnings
          cargo nextest run -p codex-router-quota-reset-test-harness

      - name: Test
        run: cargo nextest run --workspace

      - name: Deny
        run: cargo deny check

      - name: Audit
        run: cargo audit

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check GitHub Actions
        uses: raven-actions/actionlint@v2
