[package]
name = "codex-router-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codex-router"
path = "src/main.rs"

[[bin]]
name = "codex-router-quota-reset-test-harness"
path = "src/bin/quota_reset_test_harness.rs"
required-features = ["quota-reset-test-harness"]

[[test]]
name = "quota_reset_pty"
path = "tests/quota_reset_pty.rs"
required-features = ["quota-reset-test-harness"]

[features]
default = []
quota-reset-test-harness = []

[lints]
workspace = true

[dependencies]
base64.workspace = true
codex-router-auth = { path = "../codex-router-auth", version = "0.1.2" }
codex-router-core.workspace = true
codex-router-proxy = { path = "../codex-router-proxy", version = "0.1.2" }
codex-router-selection = { path = "../codex-router-selection", version = "0.1.2" }
codex-router-secret-store = { path = "../codex-router-secret-store", version = "0.1.2" }
codex-router-state = { path = "../codex-router-state", version = "0.1.2" }
clap.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
indicatif.workspace = true
iocraft.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true

[dev-dependencies]
codex-router-auth = { path = "../codex-router-auth", version = "0.1.2", features = ["sync-rusqlite-fixtures"] }
codex-router-state = { path = "../codex-router-state", version = "0.1.2", features = ["sync-rusqlite-fixtures"] }
futures-util.workspace = true
portable-pty = "0.9.0"
tungstenite = "0.28.0"
