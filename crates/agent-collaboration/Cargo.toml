[package]
name = "agent-collaboration"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
quota-reset-test-harness = ["dep:sqlx"]

[[bin]]
name = "agent-sessions"
path = "src/bin/agent-sessions.rs"

[dependencies]
chrono.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
collaboration-client = { path = "../collaboration-client", version = "0.1.14" }
message-board = { path = "../message-board", version = "0.1.20" }
codex-native-integration.workspace = true
clap.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
iocraft.workspace = true
codex-router-tui.workspace = true
jsonc-parser.workspace = true
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client"] }
url.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite"], optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std"] }
unicode-width.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["json"] }
codex-router-test-support = { path = "../codex-router-test-support", version = "0.1.4" }
collaboration-mcp = { path = "../collaboration-mcp", version = "0.1.30", features = ["test-support"] }
claude-code-peer-messaging = { path = "../claude-code-peer-messaging", version = "0.1.37" }
tempfile = "3.27.0"
jsonschema.workspace = true
reqwest = { workspace = true, features = ["json"] }
sha2.workspace = true
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }
sqlx = { workspace = true, features = ["sqlite"] }
uuid.workspace = true
agent-automation = { path = "../agent-automation", version = "0.1.16" }
automation-storage = { path = "../automation-storage", version = "0.1.16" }
codex-router-host.workspace = true
lifecycle-observation = { path = "../lifecycle-observation", version = "0.1.14" }
collaboration-service = { path = "../collaboration-service", version = "0.1.14" }
collaboration-protocol = { path = "../collaboration-protocol", version = "0.1.14" }
message-board-storage = { path = "../message-board-storage", version = "0.1.20" }
tokio-util.workspace = true
futures-util.workspace = true
tracing-subscriber.workspace = true
