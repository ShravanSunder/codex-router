[package]
name = "turso-replication-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["sync"]
sync = ["dep:turso", "dep:sqlx"]
embedded = ["libsql/core", "libsql/replication"]
single-writer = ["sync", "dep:axum", "dep:reqwest"]
driver = ["dep:sqlx-turso", "dep:driver-turso-core", "dep:driver-turso-ext", "dep:driver-turso-macros", "dep:driver-turso-parser", "dep:driver-turso-sdk-kit", "dep:driver-turso-sdk-kit-macros", "dep:driver-turso-sync-engine", "dep:driver-turso-sync-sdk-kit"]
negative-query = ["driver"]
offline-proof = ["driver"]
runtime-probe = ["dep:sync-sdk", "dep:local-sdk", "dep:reqwest"]

[[bin]]
name = "turso-replication-spike"
path = "src/main.rs"
required-features = ["sync"]

[[bin]]
name = "embedded-replica-spike"
path = "src/bin/embedded.rs"
required-features = ["embedded"]

[[bin]]
name = "sqlx-probe"
path = "src/bin/sqlx_probe.rs"
required-features = ["sync"]

[dependencies]
anyhow = "=1.0.100"
libsql = { version = "=0.9.30", default-features = false, features = ["remote", "tls"] }
serde_json = "=1.0.150"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util", "sync", "fs"] }
turso = { version = "=0.8.1", default-features = false, features = ["sync"], optional = true }

axum = { version = "=0.8.8", optional = true }
reqwest = { version = "=0.12.24", default-features = false, features = ["json"], optional = true }
sqlx-turso = { git = "https://github.com/avencera/sqlx-turso", rev = "b7e5fab909f5403f67f69d69d621f8f72e472a1f", default-features = false, features = ["runtime-tokio", "macros", "sync", "offline"], optional = true }

[[bin]]
name = "single-writer-spike"
path = "src/bin/single_writer.rs"
required-features = ["single-writer"]

[[bin]]
name = "driver-seed"
path = "src/bin/driver_seed.rs"
required-features = ["driver"]

[[bin]]
name = "driver-probe"
path = "src/bin/driver_probe.rs"
required-features = ["driver"]

[[bin]]
name = "driver-negative-query"
path = "src/bin/driver_negative_query.rs"
required-features = ["negative-query"]

[dependencies.driver-turso-core]
package = "turso_core"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[dependencies.driver-turso-ext]
package = "turso_ext"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[dependencies.driver-turso-macros]
package = "turso_macros"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[dependencies.driver-turso-parser]
package = "turso_parser"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[dependencies.driver-turso-sdk-kit]
package = "turso_sdk_kit"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[dependencies.driver-turso-sdk-kit-macros]
package = "turso_sdk_kit_macros"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[dependencies.driver-turso-sync-engine]
package = "turso_sync_engine"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[dependencies.driver-turso-sync-sdk-kit]
package = "turso_sync_sdk_kit"
version = "=0.7.0-pre.3"
optional = true
default-features = false

[[bin]]
name = "offline-writer"
path = "src/bin/offline_writer.rs"
required-features = ["single-writer"]

[dependencies.sync-sdk]
package = "turso_sync_sdk_kit"
version = "=0.8.1"
optional = true

[dependencies.local-sdk]
package = "turso_sdk_kit"
version = "=0.8.1"
optional = true

[[bin]]
name = "runtime-probe"
path = "src/bin/runtime_probe.rs"
required-features = ["runtime-probe"]
