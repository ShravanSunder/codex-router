[package]
name = "turso-replication-spike"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["sync"]
sync = ["dep:turso", "dep:sqlx"]
embedded = ["libsql/core", "libsql/replication"]

[[bin]]
name = "turso-replication-spike"
path = "src/main.rs"
required-features = ["sync"]

[[bin]]
name = "embedded-replica-spike"
path = "src/bin/embedded.rs"
required-features = ["embedded"]

[[bin]]
name = "sqlx-probe"
path = "src/bin/sqlx_probe.rs"
required-features = ["sync"]

[dependencies]
anyhow = "=1.0.100"
libsql = { version = "=0.9.30", default-features = false, features = ["remote", "tls"] }
serde_json = "=1.0.145"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"], optional = true }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "process", "io-util"] }
turso = { version = "=0.8.1", default-features = false, features = ["sync"], optional = true }
