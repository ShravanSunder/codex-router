[graph]
all-features = true

[advisories]
ignore = []

[licenses]
exceptions = [
    # Transitive dependency of the JSON Schema validator; MIT No Attribution.
    { name = "borrow-or-share", version = "=0.2.4", allow = ["MIT-0"] },
]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
