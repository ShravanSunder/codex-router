[workspace]
resolver = "3"
members = [
    "crates/message-board",
    "crates/session-event-model",
    "crates/acp-client-runtime",
    "crates/message-board-storage",
    "crates/agent-automation",
    "crates/automation-storage",
    "crates/codex-acp-adapter",
    "crates/lifecycle-observation",
    "crates/collaboration-client",
    "crates/collaboration-mcp",
    "crates/collaboration-service",
    "crates/collaboration-protocol",
    "crates/claude-code-peer-messaging",
    "crates/agent-collaboration",
    "crates/codex-router-auth",
    "crates/codex-router-cli",
    "crates/codex-native-integration",
    "crates/codex-router-core",
    "crates/codex-router-host",
    "crates/codex-router-quota-reset-test-harness",
    "crates/codex-router-proxy",
    "crates/codex-router-quota",
    "crates/codex-router-secret-store",
    "crates/codex-router-selection",
    "crates/codex-router-state",
    "crates/codex-router-test-support",
    "crates/sqlx-turso",
    "crates/sqlx-turso-core",
    "crates/sqlx-turso-macros",
    "prototypes/ux_prototype",
]

[workspace.package]
version = "0.1.86"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
agent-client-protocol = "=2.2.0"
croner = "=4.0.0"
chrono-tz = "0.10.4"
fs2 = "=0.4.3"
keyring-core = "1"
uuid = { version = "1.26.0", features = ["v5", "v7"] }
codex-router-core = { path = "crates/codex-router-core", version = "0.1.6" }
codex-native-integration = { path = "crates/codex-native-integration", version = "0.1.6" }
codex-router-host = { path = "crates/codex-router-host", version = "0.1.6" }
codex-router-quota = { path = "crates/codex-router-quota", version = "0.1.6" }
axum = { version = "0.8.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22.1"
bytes = "1.11.0"
chrono = "0.4.45"
clap = { version = "4.5.53", features = ["derive", "env", "wrap_help"] }
comfy-table = "7.2.2"
crossterm = "0.29.0"
either = "1.16.0"
futures-core = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hmac = "0.12.1"
http = "1.4.0"
http-body-util = "0.1.3"
httparse = "1.10.1"
hyper = { version = "1.8.1", features = ["http1", "http2", "client", "server"] }
hyper-tungstenite = "0.20.0"
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "http2", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1.19", features = ["client", "client-legacy", "server", "http1", "http2", "tokio"] }
indicatif = "0.18.3"
iocraft = "0.8.3"
nix = { version = "0.28", features = ["user", "hostname"] }
opentelemetry = { version = "0.31.0", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.31.1"
opentelemetry-otlp = { version = "0.31.0", features = ["http-proto", "logs", "metrics", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.31.0", features = ["logs", "metrics", "rt-tokio", "trace"] }
proptest = "1.11.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls"] }
rustix = { version = "1.1.4", features = ["fs", "process", "stdio"] }
rusqlite = { version = "0.37.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_json_canonicalizer = "0.3.2"
jsonschema = { version = "0.53.0", default-features = false }
log = "0.4.33"
percent-encoding = "2.3.2"
proc-macro-crate = "3.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.46"
rmcp = { version = "=3.4.0", default-features = false, features = ["macros", "server", "transport-streamable-http-server"] }
schemars = "1.2.2"
sha2 = "0.10.9"
security-framework = "3.7"
# Engine-agnostic SQLx; each crate enables the engine it uses (`sqlite`, or the sqlx-turso
# driver). The Turso driver implements sqlx-core internals, so every SQLx crate is pinned exactly
# and moves in lockstep.
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio"] }
sqlx-core = { version = "=0.9.0", default-features = false }
sqlx-macros-core = { version = "=0.9.0", default-features = false }
sqlx-turso = { path = "crates/sqlx-turso", version = "0.1.63" }
sqlx-turso-core = { path = "crates/sqlx-turso-core", version = "0.1.63", default-features = false }
sqlx-turso-macros = { path = "crates/sqlx-turso-macros", version = "0.1.63" }
syn = { version = "2.0.118", features = ["full", "parsing"] }
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.17", features = ["codec", "compat", "rt"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
trybuild = "1.0.116"
# Exact engine pin; default features would add mimalloc and FTS (Tantivy).
turso = { version = "=0.8.1", default-features = false }
unicode-width = "0.2.2"
url = "2.5.8"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_invalid_type = "deny"
await_holding_lock = "deny"
expect_used = "deny"
indexing_slicing = "deny"
manual_ok_or = "deny"
manual_unwrap_or = "deny"
needless_collect = "deny"
panic = "deny"
panic_in_result_fn = "deny"
redundant_clone = "deny"
string_slice = "deny"
todo = "deny"
uninlined_format_args = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Keep useful backtrace locations without full debugger metadata in local builds.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = 0

# Debug Host restarts hash the managed executable before launch and publication.
# Keep full content verification fast enough for native TUI reconnect deadlines.
[profile.dev.package.sha2]
opt-level = 3
